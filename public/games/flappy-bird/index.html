
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Flappy Bird</title>
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: radial-gradient(circle at center, #2b2d52, #12131f);
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  body { display: flex; align-items: center; justify-content: center; }
  canvas {
    display: block; border-radius: 14px;
    box-shadow: 0 15px 50px rgba(0,0,0,.6);
    cursor: pointer;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
// ================== SETUP ==================
const W = 400, H = 600, GROUND = 90;
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

function resize() {
  const scale = Math.min(window.innerWidth / W, window.innerHeight / H) * 0.96;
  const dpr = window.devicePixelRatio || 1;
  canvas.style.width = W * scale + 'px';
  canvas.style.height = H * scale + 'px';
  canvas.width = Math.floor(W * scale * dpr);
  canvas.height = Math.floor(H * scale * dpr);
  ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// ================== CONSTANTS ==================
const GRAVITY = 1600;
const FLAP_V = 460;
const MAX_FALL = 720;
const PIPE_W = 70;
const PIPE_SPEED = 150;
const PIPE_SPACING = 210;
const CAP_H = 26;
const BIRD_R = 12;

// ================== AUDIO ==================
let actx = null, muted = false;
function tone(freq, start, dur, type = 'sine', vol = 0.15, endFreq = null) {
  if (muted) return;
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  const t = actx.currentTime + start;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if (endFreq) o.frequency.exponentialRampToValueAtTime(endFreq, t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t + dur);
}
const sfx = {
  flap:  () => tone(420, 0, 0.1, 'sine', 0.18, 820),
  score: () => { tone(880, 0, 0.08, 'square', 0.07); tone(1320, 0.08, 0.15, 'square', 0.07); },
  hit:   () => { tone(220, 0, 0.3, 'sawtooth', 0.15, 50); tone(120, 0, 0.2, 'square', 0.1, 40); },
  fall:  () => tone(600, 0.15, 0.5, 'triangle', 0.1, 120),
};

// ================== STATE ==================
let state, bird, pipes, score, best, time, overTime, shake, flash, scorePop, particles, newBest;
let groundX = 0, cityX = 0;
best = parseInt(localStorage.getItem('flappyBest') || '0');

function reset() {
  state = 'ready';
  bird = { x: 110, y: H / 2 - 40, vy: 0, rot: 0, wing: 0 };
  pipes = [];
  score = 0;
  time = 0;
  shake = 0;
  flash = 0;
  scorePop = 0;
  particles = [];
  newBest = false;
}
reset();

// ================== BACKGROUND DATA ==================
const clouds = Array.from({ length: 6 }, () => ({
  x: Math.random() * W, y: 40 + Math.random() * 200,
  s: 0.6 + Math.random() * 0.8, speed: 8 + Math.random() * 12
}));

const city = [];
let cw = 0;
while (cw < W) {
  const w = 22 + Math.random() * 30;
  city.push({ x: cw, w, h: 45 + Math.random() * 75 });
  cw += w;
}
const CITY_W = cw;

const bushes = [];
for (let x = 0; x < W; x += 26) bushes.push({ x, r: 18 + Math.random() * 14 });

// ================== HELPERS ==================
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const easeOutBack = t => { const c = 1.7; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function text(str, x, y, size, fill = '#fff', stroke = '#543847', align = 'center') {
  ctx.font = `900 ${size}px "Trebuchet MS", "Arial Black", Arial, sans-serif`;
  ctx.textAlign = align;
  ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  ctx.lineWidth = Math.max(3, size / 5);
  ctx.strokeStyle = stroke;
  ctx.strokeText(str, x, y);
  ctx.fillStyle = fill;
  ctx.fillText(str, x, y);
}

function hitRect(cx, cy, r, rx, ry, rw, rh) {
  const nx = clamp(cx, rx, rx + rw), ny = clamp(cy, ry, ry + rh);
  return (cx - nx) ** 2 + (cy - ny) ** 2 < r * r;
}

// ================== GAME ACTIONS ==================
function flap() {
  bird.vy = -FLAP_V;
  bird.wing = 0;
  sfx.flap();
  for (let i = 0; i < 4; i++) {
    particles.push({
      x: bird.x - 12, y: bird.y + 4,
      vx: -60 - Math.random() * 60, vy: (Math.random() - 0.3) * 60,
      life: 0.4, max: 0.4, r: 2 + Math.random() * 3, color: '255,255,255'
    });
  }
}

function spawnPipe(x) {
  const gap = Math.max(130, 168 - score * 1.2);
  const minY = 70, maxY = H - GROUND - 70 - gap;
  pipes.push({ x, gapY: minY + Math.random() * (maxY - minY), gap, passed: false });
}

function die() {
  if (state !== 'playing') return;
  state = 'over';
  overTime = time;
  shake = 12;
  flash = 1;
  sfx.hit();
  sfx.fall();
  if (bird.vy < 0) bird.vy = 0;
  for (let i = 0; i < 14; i++) {
    const a = Math.random() * Math.PI * 2, s = 80 + Math.random() * 160;
    particles.push({
      x: bird.x, y: bird.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: 0.7, max: 0.7, r: 2 + Math.random() * 3,
      color: Math.random() < 0.5 ? '248,214,40' : '255,255,255'
    });
  }
  if (score > best) {
    best = score;
    newBest = true;
    localStorage.setItem('flappyBest', best);
  }
}

function press() {
  if (state === 'ready') { state = 'playing'; flap(); }
  else if (state === 'playing') flap();
  else if (state === 'over' && time - overTime > 0.9) reset();
}

window.addEventListener('keydown', e => {
  if (['Space', 'ArrowUp', 'KeyW', 'Enter'].includes(e.code)) {
    e.preventDefault();
    if (!e.repeat) press();
  }
  if (e.code === 'KeyM') muted = !muted;
});
window.addEventListener('pointerdown', e => { e.preventDefault(); press(); });

// ================== UPDATE ==================
function update(dt) {
  time += dt;

  // clouds always drift
  for (const c of clouds) {
    c.x -= c.speed * dt;
    if (c.x < -80 * c.s) { c.x = W + 60; c.y = 40 + Math.random() * 200; }
  }

  if (state !== 'over') {
    groundX += PIPE_SPEED * dt;
    cityX += PIPE_SPEED * 0.2 * dt;
  }

  if (state === 'ready') {
    bird.y = H / 2 - 40 + Math.sin(time * 3) * 8;
    bird.wing += dt * 12;
    bird.rot = 0;
  }

  else if (state === 'playing') {
    bird.vy = Math.min(bird.vy + GRAVITY * dt, MAX_FALL);
    bird.y += bird.vy * dt;
    bird.wing += dt * (bird.vy < 0 ? 22 : 10);
    const target = clamp(bird.vy / 550, -0.45, 1.45);
    bird.rot += (target - bird.rot) * Math.min(1, dt * 10);

    if (bird.y < BIRD_R) { bird.y = BIRD_R; bird.vy = 0; }

    // pipes
    const last = pipes[pipes.length - 1];
    if (!last) spawnPipe(W + 80);
    else if (last.x + PIPE_SPACING <= W + PIPE_W) spawnPipe(last.x + PIPE_SPACING);

    for (const p of pipes) {
      p.x -= PIPE_SPEED * dt;
      if (!p.passed && p.x + PIPE_W < bird.x) {
        p.passed = true;
        score++;
        scorePop = 1;
        sfx.score();
      }
      const top = p.gapY, bot = p.gapY + p.gap;
      if (
        hitRect(bird.x, bird.y, BIRD_R, p.x, -500, PIPE_W, top + 500) ||
        hitRect(bird.x, bird.y, BIRD_R, p.x - 4, top - CAP_H, PIPE_W + 8, CAP_H) ||
        hitRect(bird.x, bird.y, BIRD_R, p.x, bot, PIPE_W, H) ||
        hitRect(bird.x, bird.y, BIRD_R, p.x - 4, bot, PIPE_W + 8, CAP_H)
      ) die();
    }
    pipes = pipes.filter(p => p.x + PIPE_W > -20);

    if (bird.y + BIRD_R >= H - GROUND) {
      bird.y = H - GROUND - BIRD_R;
      die();
    }
  }

  else if (state === 'over') {
    if (bird.y + BIRD_R < H - GROUND) {
      bird.vy = Math.min(bird.vy + GRAVITY * dt, MAX_FALL);
      bird.y += bird.vy * dt;
      bird.rot += (Math.PI / 2 - bird.rot) * Math.min(1, dt * 8);
      if (bird.y + BIRD_R > H - GROUND) bird.y = H - GROUND - BIRD_R;
    }
  }

  // particles
  for (const p of particles) {
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vy += 300 * dt;
    p.life -= dt;
  }
  particles = particles.filter(p => p.life > 0);

  shake = Math.max(0, shake - dt * 40);
  flash = Math.max(0, flash - dt * 3);
  scorePop = Math.max(0, scorePop - dt * 5);
}

// ================== DRAW ==================
function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, H - GROUND);
  g.addColorStop(0, '#4ec0ca');
  g.addColorStop(1, '#bdeef0');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // sun
  const sg = ctx.createRadialGradient(320, 110, 10, 320, 110, 90);
  sg.addColorStop(0, 'rgba(255,250,200,1)');
  sg.addColorStop(0.35, 'rgba(255,240,150,0.6)');
  sg.addColorStop(1, 'rgba(255,240,150,0)');
  ctx.fillStyle = sg;
  ctx.beginPath(); ctx.arc(320, 110, 90, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff8c8';
  ctx.beginPath(); ctx.arc(320, 110, 26, 0, Math.PI * 2); ctx.fill();

  // clouds
  for (const c of clouds) {
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.beginPath();
    ctx.arc(c.x, c.y, 20 * c.s, 0, Math.PI * 2);
    ctx.arc(c.x + 22 * c.s, c.y - 10 * c.s, 24 * c.s, 0, Math.PI * 2);
    ctx.arc(c.x + 48 * c.s, c.y, 20 * c.s, 0, Math.PI * 2);
    ctx.arc(c.x + 24 * c.s, c.y + 6 * c.s, 20 * c.s, 0, Math.PI * 2);
    ctx.fill();
  }

  // city
  const base = H - GROUND;
  const off = -(cityX % CITY_W);
  for (let k = 0; k < 2; k++) {
    for (const b of city) {
      const x = b.x + off + k * CITY_W;
      ctx.fillStyle = '#9fd8c9';
      ctx.fillRect(x, base - b.h - 20, b.w - 2, b.h + 20);
      ctx.fillStyle = '#c7ece2';
      for (let wy = base - b.h - 12; wy < base - 30; wy += 12)
        for (let wx = x + 4; wx < x + b.w - 8; wx += 8)
          ctx.fillRect(wx, wy, 3, 5);
    }
  }

  // bushes
  const boff = -((cityX * 2) % W);
  ctx.fillStyle = '#7ed47a';
  for (let k = 0; k < 2; k++) {
    ctx.beginPath();
    for (const b of bushes) {
      ctx.moveTo(b.x + boff + k * W + b.r, base);
      ctx.arc(b.x + boff + k * W, base, b.r, Math.PI, 0);
    }
    ctx.fill();
  }
  ctx.fillStyle = '#6cc466';
  ctx.fillRect(0, base - 6, W, 6);
}

function drawPipe(x, y, h, flip) {
  const g = ctx.createLinearGradient(x, 0, x + PIPE_W, 0);
  g.addColorStop(0, '#4f9a2f');
  g.addColorStop(0.3, '#9be15d');
  g.addColorStop(0.6, '#73bf2e');
  g.addColorStop(1, '#3f7f22');
  ctx.fillStyle = g;
  ctx.strokeStyle = '#2d4a1a';
  ctx.lineWidth = 3;
  ctx.fillRect(x, y, PIPE_W, h);
  ctx.strokeRect(x, y, PIPE_W, h);

  const cy = flip ? y + h - CAP_H : y;
  const cg = ctx.createLinearGradient(x - 4, 0, x + PIPE_W + 4, 0);
  cg.addColorStop(0, '#4f9a2f');
  cg.addColorStop(0.3, '#a8ec6a');
  cg.addColorStop(0.6, '#7fcc38');
  cg.addColorStop(1, '#3f7f22');
  ctx.fillStyle = cg;
  roundRect(x - 4, cy, PIPE_W + 8, CAP_H, 3);
  ctx.fill(); ctx.stroke();

  // highlight
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.fillRect(x + 8, y + (flip ? 0 : CAP_H), 5, h - CAP_H);
}

function drawPipes() {
  for (const p of pipes) {
    drawPipe(p.x, -10, p.gapY + 10, true);
    drawPipe(p.x, p.gapY + p.gap, H - GROUND - (p.gapY + p.gap) + 5, false);
  }
}

function drawGround() {
  const gy = H - GROUND;
  ctx.fillStyle = '#ded895';
  ctx.fillRect(0, gy, W, GROUND);

  ctx.fillStyle = '#d0c874';
  for (let i = 0; i < 3; i++) ctx.fillRect(0, gy + 35 + i * 18, W, 3);

  ctx.fillStyle = '#73bf2e';
  ctx.fillRect(0, gy, W, 16);
  ctx.save();
  ctx.beginPath(); ctx.rect(0, gy, W, 16); ctx.clip();
  ctx.fillStyle = '#9ce659';
  for (let x = -(groundX % 24) - 24; x < W + 24; x += 24) {
    ctx.beginPath();
    ctx.moveTo(x, gy); ctx.lineTo(x + 12, gy);
    ctx.lineTo(x + 2, gy + 16); ctx.lineTo(x - 10, gy + 16);
    ctx.fill();
  }
  ctx.restore();
  ctx.fillStyle = '#558c22';
  ctx.fillRect(0, gy + 16, W, 4);
  ctx.fillStyle = '#543847';
  ctx.fillRect(0, gy - 1, W, 3);
}

function drawBird() {
  ctx.save();
  ctx.translate(bird.x, bird.y);
  ctx.rotate(bird.rot);
  ctx.lineWidth = 2.5;
  ctx.strokeStyle = '#543847';

  // body
  const bg = ctx.createRadialGradient(-4, -5, 2, 0, 0, 18);
  bg.addColorStop(0, '#ffe96a');
  bg.addColorStop(1, '#f5c518');
  ctx.fillStyle = bg;
  ctx.beginPath(); ctx.ellipse(0, 0, 17, 13, 0, 0, Math.PI * 2);
  ctx.fill(); ctx.stroke();

  // belly
  ctx.fillStyle = '#fff3b0';
  ctx.beginPath(); ctx.ellipse(-1, 6, 10, 5, 0, 0, Math.PI * 2); ctx.fill();

  // wing
  const wa = state === 'over' && bird.y + BIRD_R >= H - GROUND ? 0 : Math.sin(bird.wing) * 0.7;
  ctx.fillStyle = '#fffbe6';
  ctx.beginPath(); ctx.ellipse(-8, 1, 8, 5.5, wa, 0, Math.PI * 2);
  ctx.fill(); ctx.stroke();

  // eye
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(7, -5, 6, 0, Math.PI * 2);
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#222';
  if (state === 'over') {
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(5, -7); ctx.lineTo(10, -2);
    ctx.moveTo(10, -7); ctx.lineTo(5, -2);
    ctx.stroke();
    ctx.lineWidth = 2.5;
  } else {
    ctx.beginPath(); ctx.arc(9, -5, 2.8, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(10, -6, 1, 0, Math.PI * 2); ctx.fill();
  }

  // beak
  ctx.fillStyle = '#f75e2b';
  ctx.beginPath(); ctx.ellipse(16, 1, 7, 3.5, 0, 0, Math.PI * 2);
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#e0441b';
  ctx.beginPath(); ctx.ellipse(14, 5.5, 6, 2.8, 0, 0, Math.PI * 2);
  ctx.fill(); ctx.stroke();

  ctx.restore();
}

function drawParticles() {
  for (const p of particles) {
    ctx.fillStyle = `rgba(${p.color},${p.life / p.max})`;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
  }
}

function drawMedal(x, y, s) {
  let colors = null;
  if (s >= 40) colors = ['#e8fbff', '#8fd8ea'];
  else if (s >= 30) colors = ['#fff29a', '#e0a800'];
  else if (s >= 20) colors = ['#ffffff', '#a9a9a9'];
  else if (s >= 10) colors = ['#f5c28b', '#b0662a'];

  ctx.lineWidth = 3;
  ctx.strokeStyle = '#543847';
  if (!colors) {
    ctx.fillStyle = '#cfc680';
    ctx.beginPath(); ctx.arc(x, y, 26, 0, Math.PI * 2); ctx.fill();
    return;
  }
  const g = ctx.createRadialGradient(x - 8, y - 8, 3, x, y, 28);
  g.addColorStop(0, colors[0]);
  g.addColorStop(1, colors[1]);
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, 26, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

  // star
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const r = i % 2 ? 6 : 14, a = -Math.PI / 2 + i * Math.PI / 5;
    ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
  }
  ctx.closePath(); ctx.fill();

  // sparkle
  const sp = (Math.sin(time * 4) + 1) / 2;
  ctx.fillStyle = `rgba(255,255,255,${sp})`;
  ctx.beginPath(); ctx.arc(x + 12, y - 14, 2.5, 0, Math.PI * 2); ctx.fill();
}

function drawUI() {
  if (state === 'playing') {
    const s = 1 + scorePop * 0.35;
    ctx.save();
    ctx.translate(W / 2, 70);
    ctx.scale(s, s);
    text(score, 0, 0, 52);
    ctx.restore();
  }

  if (state === 'ready') {
    text('Flappy Bird', W / 2, 130 + Math.sin(time * 2) * 4, 50, '#ffe14d');
    text('Get Ready!', W / 2, 200, 30, '#7fe04a');

    const a = 0.6 + Math.sin(time * 5) * 0.4;
    ctx.globalAlpha = a;
    text('Tap or press SPACE', W / 2, 380, 22);
    ctx.globalAlpha = 1;
    if (best > 0) text('Best: ' + best, W / 2, 420, 18, '#fff');
    text('M = mute', W / 2, H - 30, 14, '#fff');
  }

  if (state === 'over') {
    const t = time - overTime;

    // title
    const tt = clamp(t / 0.35, 0, 1);
    ctx.globalAlpha = tt;
    text('Game Over', W / 2, 110 + (1 - tt) * -30, 48, '#ff8a3d');
    ctx.globalAlpha = 1;

    // panel
    const pt = clamp((t - 0.3) / 0.5, 0, 1);
    if (pt > 0) {
      const py = H + 100 - (H + 100 - 190) * easeOutBack(pt);
      const px = W / 2 - 140;

      ctx.fillStyle = 'rgba(0,0,0,0.2)';
      roundRect(px + 4, py + 6, 280, 150, 14); ctx.fill();
      ctx.fillStyle = '#ded895';
      ctx.strokeStyle = '#543847';
      ctx.lineWidth = 4;
      roundRect(px, py, 280, 150, 14); ctx.fill(); ctx.stroke();
      ctx.strokeStyle = '#f6f0c0';
      ctx.lineWidth = 2;
      roundRect(px + 6, py + 6, 268, 138, 10); ctx.stroke();

      text('MEDAL', px + 65, py + 32, 16, '#e86a3a', '#fff');
      drawMedal(px + 65, py + 85, score);

      text('SCORE', px + 210, py + 30, 16, '#e86a3a', '#fff');
      text(score, px + 210, py + 60, 30);
      text('BEST', px + 210, py + 95, 16, '#e86a3a', '#fff');
      text(best, px + 210, py + 124, 30);

      if (newBest) {
        ctx.fillStyle = '#ff3b3b';
        roundRect(px + 138, py + 86, 38, 18, 5); ctx.fill();
        ctx.font = '900 12px Arial';
        ctx.fillStyle = '#fff';
        ctx.textAlign = 'center';
        ctx.fillText('NEW', px + 157, py + 96);
      }
    }

    if (t > 0.9) {
      ctx.globalAlpha = 0.6 + Math.sin(time * 5) * 0.4;
      text('Tap to play again', W / 2, 400, 24);
      ctx.globalAlpha = 1;
    }
  }
}

function draw() {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  drawSky();
  drawPipes();
  drawGround();
  drawParticles();
  drawBird();
  ctx.restore();

  if (flash > 0) {
    ctx.fillStyle = `rgba(255,255,255,${flash * 0.8})`;
    ctx.fillRect(0, 0, W, H);
  }
  drawUI();
}

// ================== LOOP ==================
let last = performance.now();
function loop(now) {
  const dt = Math.min((now - last) / 1000, 1 / 30);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
